<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Pagamento</title>
    <link rel="stylesheet" href="css/style pagamento.css">
</head>
<body>
    <header>

        <nav>

        </nav>

    <main>
        <div class="pagamento">
        <h2>Forma de Pagamento</h2>
        <h3>Total R$ <span id="totalPagamento">0,00</span></h3>

       </label>
       <label>

       </label>
       <label>
        <input type="radio" name="pagamento" value="Dinheiro">

       </label>
        <button type="submit">Confirmar Pagamento</button>
        </form>
    </div>
    </main>
        <script src="js/pagamento.js"></script>
