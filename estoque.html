
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque</title>
    <link rel="stylesheet" href="css/style estoque.css">
</head>
<body>

    <header>
        <h1>Estoque</h1>

        <nav>
            <a href="Cardapio.html">Voltar ao Cardápio</a>
        </nav>
    </header>

    <main>
        <div class="estoque">

            <h2>Controle de Estoque</h2>
            <p>Confira a quantidade disponível de cada produto</p>

            <!-- Cadastro de novos produtos -->
            <h2>Cadastrar Produto</h2>

            <form id="formProduto">

                <input
                    type="text"
                    id="nomeProduto"
                    placeholder="Nome do produto"
                    required
                >

                <input
                    type="number"
                    id="precoProduto"
                    placeholder="Preço (R$)"
                    min="0.01"
                    step="0.01"
                    required
                >

                <input
                    type="number"
                    id="quantidadeProduto"
                    placeholder="Quantidade"
                    min="0"
                    step="1"
                    required
                >

                <button type="submit" id="btnCadastrar">
                    Cadastrar
                </button>

            </form>

            <!-- Lista de produtos do estoque -->
            <h2>Produtos Cadastrados</h2>

            <div id="listaEstoque">

                <!-- Coxinha -->
                <div class="produto">
                    <h3>Coxinha</h3>

                    <p>
                        Quantidade:
                        <span class="quantidade">20</span>
                    </p>

                    <p class="status">Status: Disponível</p>

                    <button type="button" class="diminuir">−</button>
                    <button type="button" class="aumentar">+</button>
                </div>

                <!-- Esfiha -->
                <div class="produto">
                    <h3>Esfiha</h3>

                    <p>
                        Quantidade:
                        <span class="quantidade">15</span>
                    </p>

                    <p class="status">Status: Disponível</p>

                    <button type="button" class="diminuir">−</button>
                    <button type="button" class="aumentar">+</button>
                </div>

                <!-- Pastel -->
                <div class="produto">
                    <h3>Pastel</h3>

                    <p>
                        Quantidade:
                        <span class="quantidade">0</span>
                    </p>

                    <p class="status">Status: Indisponível</p>

                    <button type="button" class="diminuir">−</button>
                    <button type="button" class="aumentar">+</button>
                </div>

            </div>

        </div>
    </main>

    <script src="js/estoque.js"></script>

</body>
</html>
