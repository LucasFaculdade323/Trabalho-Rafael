<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação do Pedido</title>
    <link rel="stylesheet" href="css/style confirmacaopedido.css">
</head>
<body>

    <header>
        <h1>Pedido Confirmado</h1>
    </header>
  <main>
    <div class="confirmacao">

        <h2>Pedido realizado com sucesso</h2>

        <h3>Produtos</h3> 
        <div id="produtosConfirmacao"></div>

        <p>Total: R$ <span id="totalConfirmacao">0,00</span></p>

        <p>Forma de Pagamento:  <span id="formaPagamento"></span></p>
        <h3>Acompanhamento do Pedido</h3>
        <p>Status: <strong id="statusPedido">Em preparação</strong></p>
        <h3>Atualizar Status</h3>

    <select id="selecionarStatus">
    <option value="Em preparação">Em preparação</option>
    <option value="Pronto">Pronto</option>
    <option value="Entregue">Entregue</option>
    </select>

    <button type="button" id="atualizarStatus">Atualizar Status</button>
    <h3>Cancelamento do Pedido</h3>

    <button type="button" id="cancelarPedido">Cancelar Pedido</button>

        
        <a href="Cardapio.html">Fazer novo pedido</a>
        <a href="estoque.html">Ver Estoque</a>


    </div>
    <script src="js/confirmacaopedido.js"></script>
  </main>
  </body>
</html>
